services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vibration
      POSTGRES_PASSWORD: vibration
      POSTGRES_DB: vibration
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibration -d vibration"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vibration:vibration@db:5432/vibration
      DB_POOL_MIN: "2"
      DB_POOL_MAX: "10"
    ports:
      - "8000:8000"

volumes:
  pgdata:
